name: Diagnostic — paquet Météo-France
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          METEOFRANCE_KEY: ${{ secrets.METEOFRANCE_KEY }}
          METEOFRANCE_KEY_OBS2: ${{ secrets.METEOFRANCE_KEY_OBS2 }}
          METEOFRANCE_KEY_PACK2: ${{ secrets.METEOFRANCE_KEY_PACK2 }}
        run: node pipeline/tools/probe-mf2.ts
