name: Widget Windows — test sur un vrai Windows

# Le widget Windows (PowerShell 5.1 + WPF) ne tourne que sous Windows : on le vérifie ici,
# avec Windows PowerShell 5.1 comme sur les PC, sur les données réelles publiées par OCEAN.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["widgets/windows/**", "tests/widgets-windows.test.ts", ".github/workflows/widget-windows.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fuseau de Paris (comme les PC des utilisateurs)
        run: tzutil /s "Romance Standard Time"
      - name: Ce que le widget affiche (Windows PowerShell 5.1, mêmes tests qu'en local)
        shell: pwsh
        env: { OCEAN_PS: powershell }
        run: node --test tests/widgets-windows.test.ts
      - name: Images des cartes sur les données réelles
        shell: pwsh
        run: |
          git show origin/data:public/widget-wind.json > real.json
          $surf = @()
          git show origin/data:public/widget-surf.json > real-surf.json 2>$null
          if ($LASTEXITCODE -eq 0) { $surf = @('-SurfFile', 'real-surf.json') }
          powershell -NoProfile -ExecutionPolicy Bypass -STA -File widgets/windows/ocean-widget.ps1 -Capture captures -DataFile real.json @surf
          if ((Get-ChildItem captures -Filter *.png).Count -lt 9) { throw 'images manquantes' }
      - name: Installation, widget lancé au démarrage, désinstallation
        shell: pwsh
        run: |
          cmd /c "widgets\windows\installer.cmd < NUL"
          Start-Sleep -Seconds 25
          $dir = Join-Path $env:LOCALAPPDATA 'OCEAN'
          if (-not (Test-Path (Join-Path $dir 'ocean-widget.ps1'))) { throw 'script non copié' }
          $run = Get-ItemPropertyValue 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name OCEANWidget
          if ($run -notlike '*ocean-widget.ps1*') { throw 'pas de lancement au démarrage' }
          $p = Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object { $_.CommandLine -like '*ocean-widget.ps1*' -and $_.CommandLine -notlike '*-Install*' }
          if (-not $p) { throw 'widget non lancé' }
          if (-not (Test-Path (Join-Path $dir 'donnees.json'))) { throw 'données non téléchargées par le widget' }
          $log = Join-Path $dir 'erreur.log'
          if (Test-Path $log) { Get-Content $log; throw 'erreurs dans erreur.log' }
          # capture du bureau (si la session en a un)
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = [System.Drawing.Bitmap]::new($b.Width, $b.Height); $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save("$PWD\captures\bureau.png")
          } catch { Write-Host "capture du bureau impossible : $_" }
          cmd /c "widgets\windows\desinstaller.cmd < NUL"
          Start-Sleep -Seconds 3
          if (Test-Path $dir) { throw 'dossier non supprimé' }
          if (Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object { $_.CommandLine -like '*ocean-widget.ps1*' }) { throw 'widget encore lancé' }
      - name: Publier les images (branche captures)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path captures)) { exit 0 }
          git config user.name "ocean-bot"; git config user.email "ocean-bot@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP 'cap'; Copy-Item captures $tmp -Recurse; Remove-Item captures -Recurse -Force
          git checkout --orphan captures-tmp; git rm -rfq .
          Copy-Item "$tmp\*" . ; git add *.png
          git commit -qm "Images du widget Windows ($env:GITHUB_SHA)"
          git push -fq origin HEAD:captures
