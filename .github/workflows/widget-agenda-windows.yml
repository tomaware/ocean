name: Widget Agenda Windows — test sur un vrai Windows

# Le widget Agenda (PowerShell 5.1 + WPF) ne tourne que sous Windows : on le vérifie ici, sur un agenda FICTIF
# (le dépôt et les images sont publics : aucune donnée de l'agenda de Tom).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["widgets/agenda-windows/**", "tests/widget-agenda-windows.test.ts", "tests/widgets/agenda-fixture.ts", ".github/workflows/widget-agenda-windows.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fuseau de Paris (comme les PC des utilisateurs)
        run: tzutil /s "Romance Standard Time"
      - name: Ce que le widget affiche (Windows PowerShell 5.1, mêmes tests qu'en local)
        shell: pwsh
        env: { OCEAN_PS: powershell }
        run: node --test tests/widget-agenda-windows.test.ts
      - name: Lien du script Google enregistré chiffré puis relu
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File widgets/agenda-windows/agenda-widget.ps1 -TestLien
      - name: Images de la carte (agenda fictif)
        shell: pwsh
        run: |
          node -e "import('./tests/widgets/agenda-fixture.ts').then(f => { require('fs').writeFileSync('v1.json', JSON.stringify(f.agendaV1())); require('fs').writeFileSync('v2.json', JSON.stringify(f.agendaV2())); console.log(f.NOW) })" > now.txt
          $now = Get-Content now.txt
          powershell -NoProfile -ExecutionPolicy Bypass -STA -File widgets/agenda-windows/agenda-widget.ps1 -Capture captures -DataFile v1.json -Now $now
          powershell -NoProfile -ExecutionPolicy Bypass -STA -File widgets/agenda-windows/agenda-widget.ps1 -Capture captures-v2 -DataFile v2.json -Now $now -Reglages '{"agendas":{"Agenda Loïc":true}}'
          Get-ChildItem captures-v2 -Filter 'agenda-grand-*.png' | ForEach-Object { Copy-Item $_.FullName (Join-Path captures ('v2-loic-' + $_.Name)) }
          if ((Get-ChildItem captures -Filter *.png).Count -lt 10) { throw 'images manquantes' }
      - name: Installation, widget lancé au démarrage, désinstallation
        shell: pwsh
        run: |
          cmd /c "widgets\agenda-windows\installer.cmd < NUL"
          Start-Sleep -Seconds 20
          $dir = Join-Path $env:LOCALAPPDATA 'OCEAN-Agenda'
          if (-not (Test-Path (Join-Path $dir 'agenda-widget.ps1'))) { throw 'script non copié' }
          $run = Get-ItemPropertyValue 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name OCEANAgenda
          if ($run -notlike '*agenda-widget.ps1*') { throw 'pas de lancement au démarrage' }
          $p = Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object { $_.CommandLine -like '*agenda-widget.ps1*' -and $_.CommandLine -notlike '*-Install*' }
          if (-not $p) { throw 'widget non lancé' }
          $log = Join-Path $dir 'erreur.log'
          if (Test-Path $log) { Get-Content $log; throw 'erreurs dans erreur.log' }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = [System.Drawing.Bitmap]::new($b.Width, $b.Height); $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save("$PWD\captures\bureau.png")
          } catch { Write-Host "capture du bureau impossible : $_" }
          cmd /c "widgets\agenda-windows\desinstaller.cmd < NUL"
          Start-Sleep -Seconds 3
          if (Test-Path $dir) { throw 'dossier non supprimé' }
          if (Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Where-Object { $_.CommandLine -like '*agenda-widget.ps1*' }) { throw 'widget encore lancé' }
      - name: Publier les images (branche captures-agenda)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path captures)) { exit 0 }
          git config user.name "ocean-bot"; git config user.email "ocean-bot@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP 'cap'; Copy-Item captures $tmp -Recurse; Remove-Item captures, captures-v2 -Recurse -Force -ErrorAction SilentlyContinue
          git checkout --orphan captures-agenda-tmp; git rm -rfq .
          Copy-Item "$tmp\*" . ; git add *.png
          git commit -qm "Images du widget Agenda ($env:GITHUB_SHA)"
          git push -fq origin HEAD:captures-agenda
