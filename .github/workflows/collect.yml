name: ① Collecte + ② Analyse

on:
  schedule:
    - cron: "41 * * * *"        # toutes les heures (après Super Prévi Surf, qui met à jour les bouées vers :07)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Collecte
        env:
          SUPER_PREVISION_URL: ${{ secrets.SUPER_PREVISION_URL }}   # vent corrigé (jamais les relevés Winds-Up)
        run: npm run collect
      - name: Archiver les séries collectées
        uses: actions/upload-artifact@v4
        with:
          name: collect-bundle
          path: data/v1/collect/bundle.json
          retention-days: 7
      - name: Analyse (moteurs surf + downwind, test golden ; note wing)
        env:
          SUPER_PREVISION_URL: ${{ secrets.SUPER_PREVISION_URL }}   # seulement pour vérifier qu'il ne fuit pas
        run: npm run engines
      - name: Archiver les prévisions calculées
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engines-output
          path: |
            data/v1/engines/surf.json
            data/v1/engines/downwind.json
            data/v1/engines/wing.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Supprimer les fichiers privés
        if: always()
        run: rm -rf data/private
      - name: Publier les rapports
        if: always()
        run: |
          git config user.name "ocean-bot"
          git config user.email "ocean-bot@users.noreply.github.com"
          git add data/v1/collect/status.json docs/quality/COLLECT_REPORT.md
          git add data/v1/engines/status.json docs/quality/ENGINES_REPORT.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "collecte : $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git pull -q --rebase -X theirs origin main || { git rebase --abort; git reset -q --soft origin/main; git commit -qm "collecte : $(date -u +%Y-%m-%dT%H:%MZ)"; }
            sleep $((i * 5))
          done
          echo "::warning::rapport non publié"
