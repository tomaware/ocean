name: OCEAN — collecte, analyse, vérification, publication

on:
  schedule:
    - cron: "41 * * * *"        # toutes les heures (après Super Prévi Surf, qui met à jour les bouées vers :07)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocean-collect
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: ① Collecte
        env:
          SUPER_PREVISION_URL: ${{ secrets.SUPER_PREVISION_URL }}   # vent corrigé (relevés Winds-Up : fichier privé, jamais publié)
        run: npm run collect
      - name: ② Analyse (moteurs surf + downwind, test golden ; note wing)
        env:
          SUPER_PREVISION_URL: ${{ secrets.SUPER_PREVISION_URL }}   # seulement pour vérifier qu'il ne fuit pas
        run: npm run engines
      - name: Récupérer l'archive des prévisions (branche data)
        run: |
          mkdir -p data/state
          git fetch -q --depth 1 origin data && git show origin/data:state/archive.json > data/state/archive.json || { echo "pas d'archive : on repart de zéro"; rm -f data/state/archive.json; }
      - name: ③ Remise en question
        run: npm run verify
      - name: ④ Sessions + données publiques
        env:
          SUPER_PREVISION_URL: ${{ secrets.SUPER_PREVISION_URL }}
        run: npm run publish-data
      - name: Supprimer les fichiers privés
        if: always()
        run: rm -rf data/private
      - name: ⑤ Interface
        run: |
          npm run build
          mkdir -p dist/data && cp data/v1/public/*.json dist/data/
      - name: Test de l'interface sur les données réelles (mobile + ordinateur)
        run: |
          npm i --no-save playwright@1.55.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          (npx vite preview --port 4173 --strictPort >/dev/null 2>&1 &) && sleep 4
          node tests/ui/smoke.mjs http://localhost:4173
      - name: Publier les données (branche data, un seul commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(mktemp -d); mkdir -p $D/public $D/state
          cp data/v1/public/*.json $D/public/ && cp data/state/archive.json $D/state/
          cd $D && git init -q -b data && git config user.name ocean-bot && git config user.email ocean-bot@users.noreply.github.com
          git add -A && git commit -qm "données $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier les rapports
        if: always()
        run: |
          git config user.name "ocean-bot"
          git config user.email "ocean-bot@users.noreply.github.com"
          git add data/v1/collect/status.json docs/quality/COLLECT_REPORT.md
          git add data/v1/engines/status.json docs/quality/ENGINES_REPORT.md docs/quality/VERIFY_REPORT.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "rapports : $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git pull -q --rebase -X theirs origin main || { git rebase --abort; git reset -q --soft origin/main; git commit -qm "rapports : $(date -u +%Y-%m-%dT%H:%MZ)"; }
            sleep $((i * 5))
          done
          echo "::warning::rapports non publiés"

  # Site : nécessite GitHub Pages activé (Réglages → Pages → Source : GitHub Actions)
  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
